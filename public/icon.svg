<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with safe rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#27272a" stroke-width="8" />
  <!-- Wallet / Vault / Finance shield icon inside safe zone -->
  <circle cx="256" cy="256" r="160" fill="#18181b" stroke="#3b82f6" stroke-width="6" opacity="0.4" />
  <g transform="translate(136, 136)">
    <!-- Main Finance Emblem -->
    <path d="M40 70 C40 50 60 30 90 30 L190 30 C210 30 220 45 220 65 L220 180 C220 200 200 215 180 215 L60 215 C40 215 40 200 40 180 Z" fill="url(#accent)" />
    <!-- Flap -->
    <path d="M40 70 L140 130 C150 136 160 136 170 130 L220 95" fill="none" stroke="#60a5fa" stroke-width="10" stroke-linecap="round" />
    <!-- Golden Coin Badge -->
    <circle cx="155" cy="150" r="38" fill="url(#gold)" stroke="#fef3c7" stroke-width="4" />
    <text x="155" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#78350f" text-anchor="middle">£</text>
    <!-- Uptrend Arrow -->
    <path d="M75 145 L105 115 L125 130 L145 105" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="135 105 145 105 145 115" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
