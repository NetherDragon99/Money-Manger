<!doctype html>
<html lang="en" style="background-color: #000000; color: #ffffff;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Finance Tracker</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // Redirects 404 paths back to the SPA root
      const path = window.location.pathname;
      const repoSegments = path.split('/').filter(Boolean);
      // If deployed in a subdirectory like /repo-name/some-page, redirect to /repo-name/
      const basePath = repoSegments.length > 0 ? '/' + repoSegments[0] + '/' : '/';
      window.location.replace(basePath);
    </script>
  </head>
  <body style="background-color: #000000; color: #ffffff; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <p style="font-size: 16px; color: #a1a1aa;">Redirecting to Personal Finance Tracker...</p>
    </div>
  </body>
</html>
