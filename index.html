<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Personal Finance Tracker</title>
    <meta name="description" content="An offline-first, OLED dark-themed personal finance tracker PWA with running balances, multi-account management, custom cycles, and budgeting." />
    <meta property="og:title" content="Personal Finance Tracker" />
    <meta property="og:description" content="An offline-first, OLED dark-themed personal finance tracker PWA with running balances, multi-account management, custom cycles, and budgeting." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinanceApp" />
    <meta name="application-name" content="FinanceApp" />
    <meta name="msapplication-navbutton-color" content="#000000" />
    <meta name="msapplication-starturl" content="./" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="alternate icon" type="image/png" href="./favicon.png" />
    <script>
      // Capture beforeinstallprompt immediately in head so it is never missed before React mounts
      try {
        window.deferredPwaPrompt = null;
        window.deferredPWAInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.deferredPwaPrompt = e;
          window.deferredPWAInstallPrompt = e;
          window.dispatchEvent(new CustomEvent('pwa-install-ready', { detail: e }));
        });
        window.addEventListener('appinstalled', function () {
          window.deferredPwaPrompt = null;
          window.deferredPWAInstallPrompt = null;
          window.dispatchEvent(new CustomEvent('app-installed-event'));
        });
        window.triggerDirectPwaInstall = function () {
          var p = window.deferredPwaPrompt || window.deferredPWAInstallPrompt;
          if (p) {
            p.prompt();
            return true;
          }
          return false;
        };
      } catch (err) {
        console.warn('[PWA Early Init] Non-fatal head script error:', err);
      }
    </script>
  </head>
  <body class="bg-black text-white antialiased selection:bg-blue-600 selection:text-white">
    <noscript>
      <div style="background-color: #000000; color: #ffffff; padding: 32px; text-align: center; font-family: sans-serif;">
        <h2>JavaScript is required</h2>
        <p>Please enable JavaScript in your browser to run Personal Finance Tracker.</p>
      </div>
    </noscript>
    <div id="root"></div>

    <!-- Dark Mode Boot Loader (Native Pure HTML/CSS) -->
    <div id="app-boot-loader" style="position: fixed; inset: 0; z-index: 999999; background: #090d16; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 24px; box-sizing: border-box; overflow: hidden; user-select: none;">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; max-width: 420px; width: 100%; text-align: center;">
        <!-- Logo / Icon -->
        <div style="width: 56px; height: 56px; border-radius: 16px; background: #131b2e; border: 1px solid #1e293b; display: flex; align-items: center; justify-content: center; margin-bottom: 18px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>

        <!-- App Title -->
        <div style="font-size: 19px; font-weight: 700; color: #f8fafc; letter-spacing: -0.02em; margin-bottom: 6px;">
          Personal Finance Tracker
        </div>
        <div style="font-size: 12px; color: #64748b; margin-bottom: 24px; direction: rtl;">
          متتبع الميزانية والمصاريف
        </div>

        <!-- Spinner -->
        <div id="app-boot-spinner" style="width: 32px; height: 32px; border: 3px solid rgba(59, 130, 246, 0.15); border-top-color: #3b82f6; border-radius: 50%; animation: bootSpin 0.75s linear infinite; margin-bottom: 12px;"></div>

        <!-- Error Card (Hidden by default, shown ONLY if boot fails before React mounts) -->
        <div id="app-boot-error" style="display: none; width: 100%; background: #131b2e; border: 1px solid #dc2626; border-radius: 18px; padding: 20px; margin-top: 16px; box-shadow: 0 15px 30px rgba(0,0,0,0.6); box-sizing: border-box;">
          <div style="font-size: 28px; margin-bottom: 8px;">⚠️</div>
          <div id="app-boot-error-title" style="font-size: 14px; font-weight: 700; color: #f87171; margin-bottom: 6px;">
            Startup Issue Detected
          </div>
          <div id="app-boot-error-msg" style="font-size: 11px; color: #cbd5e1; background: #090d16; border: 1px solid #1e293b; border-radius: 10px; padding: 10px; margin-bottom: 14px; word-break: break-all; max-height: 120px; overflow-y: auto; font-family: monospace; text-align: left; direction: ltr;"></div>
          <button id="app-boot-reload-btn" type="button" onclick="window.location.reload()" style="display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 11px 18px; background: #2563eb; color: #ffffff; border: none; border-radius: 9999px; font-size: 13px; font-weight: 600; cursor: pointer;">
            Reload App
          </button>
        </div>
      </div>

      <!-- Exact App Version at Bottom -->
      <div style="position: absolute; bottom: 20px; font-size: 11px; font-family: monospace; color: #475569; letter-spacing: 0.04em;">
        v%APP_VERSION%
      </div>
    </div>
    <style>
      @keyframes bootSpin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Early Boot Error Catcher & 12-Second Mount Watchdog -->
    <script>
      (function () {
        window.__appMounted = false;

        function showBootError(msg) {
          if (window.__appMounted) return;
          try {
            var isAr = false;
            try {
              var s = localStorage.getItem('pwa_finance_settings');
              if (s) {
                var p = JSON.parse(s);
                if (p && p.language === 'ar') isAr = true;
              }
            } catch (e) {}

            var loader = document.getElementById('app-boot-loader');
            var errBox = document.getElementById('app-boot-error');
            var errTitle = document.getElementById('app-boot-error-title');
            var errMsg = document.getElementById('app-boot-error-msg');
            var reloadBtn = document.getElementById('app-boot-reload-btn');
            var spinner = document.getElementById('app-boot-spinner');

            if (errTitle) errTitle.textContent = isAr ? 'تعذر بدء التشغيل' : 'Startup Issue Detected';
            if (reloadBtn) reloadBtn.textContent = isAr ? 'إعادة تحميل التطبيق' : 'Reload App';
            if (errBox) {
              errBox.dir = isAr ? 'rtl' : 'ltr';
              errBox.style.display = 'block';
            }
            if (errMsg) {
              errMsg.textContent = msg || (isAr ? 'حدث خطأ غير معروف أثناء تشغيل التطبيق.' : 'An unknown error occurred during startup.');
            }
            if (spinner) spinner.style.display = 'none';
          } catch (e) {
            console.error('[BootLoader] Failed to show error:', e);
          }
        }

        // 12-second mount watchdog
        var watchdogTimer = setTimeout(function () {
          if (!window.__appMounted) {
            var isAr = false;
            try {
              var s = localStorage.getItem('pwa_finance_settings');
              if (s) {
                var p = JSON.parse(s);
                if (p && p.language === 'ar') isAr = true;
              }
            } catch (e) {}
            var timeoutMsg = isAr
              ? 'يستغرق بدء التشغيل وقتاً أطول من المتوقع. يرجى إعادة التحميل أو التحقق من اتصالك.'
              : 'Startup is taking longer than expected. Please reload or check your connection.';
            showBootError(timeoutMsg);
          }
        }, 12000);

        window.__clearBootWatchdog = function () {
          if (watchdogTimer) {
            clearTimeout(watchdogTimer);
            watchdogTimer = null;
          }
        };

        // Window error listener with useCapture to catch asset loading failures
        window.addEventListener('error', function (event) {
          if (window.__appMounted) return;
          var text = '';
          if (event && event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
            var src = event.target.src || event.target.href || 'resource';
            text = 'Failed to load asset: ' + src;
          } else if (event && event.message) {
            text = event.message;
            if (event.filename) {
              text += ' (' + event.filename + ':' + (event.lineno || 0) + ')';
            }
          } else {
            text = 'Script error during app boot.';
          }
          showBootError(text);
        }, true);

        // Window unhandled promise rejection listener
        window.addEventListener('unhandledrejection', function (event) {
          if (window.__appMounted) return;
          var reason = event && event.reason;
          var msg = reason ? (reason.message || String(reason)) : 'Unhandled promise rejection during boot.';
          showBootError(msg);
        });
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
